<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>카드놀이 (Windows Classic Solitaire)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 리셋 및 클래식 윈도우 폰트 설정 */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --win-gray: #c0c0c0;
            --win-light: #ffffff;
            --win-med: #dfdfdf;
            --win-dark: #808080;
            --win-black: #000000;
            --felt-green: #008000;

            /* 반응형 카드 치수 기본값 (JS에서 실시간 갱신) */
            --card-w: 88px;
            --card-h: 122px;
            --col-gap: 14px;
            --rank-font: 28px;
            --suit-font: 20px;
            --corner-pad: 4px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #008080; /* 클래식 Windows 95/98 바탕화면 색상 */
            font-family: 'Gulim', '굴림', 'Dotum', '돋움', Tahoma, sans-serif;
            font-size: 12px;
            color: #000000;
            overflow: hidden;
        }

        /* 클래식 Windows 3D 창 외곽선 */
        .win-frame {
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-med);
            border-left: 2px solid var(--win-med);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark), 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        /* 네이비 블루 그라데이션 타이틀 바 */
        .win-titlebar {
            background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
            color: #ffffff;
            font-weight: bold;
            padding: 3px 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        /* 창 우측 상단 미니 컨트롤 버튼 */
        .win-ctrl-btn {
            width: 16px;
            height: 14px;
            background-color: var(--win-gray);
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-black);
            border-bottom: 1px solid var(--win-black);
            box-shadow: inset -1px -1px 0 var(--win-dark);
            color: #000000;
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .win-ctrl-btn:active {
            border-top: 1px solid var(--win-black);
            border-left: 1px solid var(--win-black);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
            box-shadow: none;
        }

        /* 클래식 입체 버튼 */
        .win-btn {
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            box-shadow: inset -1px -1px 0 var(--win-dark);
            color: #000000;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
        }
        .win-btn:hover:not(:disabled) {
            background-color: #cacaca;
        }
        .win-btn:active:not(:disabled) {
            border-top: 1px solid var(--win-black);
            border-left: 1px solid var(--win-black);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
            box-shadow: inset 1px 1px 0 var(--win-dark);
            transform: translate(1px, 1px);
        }
        .win-btn:disabled {
            color: #777777;
            text-shadow: 1px 1px 0 #ffffff;
            cursor: default;
        }

        /* 움푹 들어간 패널 베벨 */
        .win-sunken {
            border-top: 2px solid var(--win-dark);
            border-left: 2px solid var(--win-dark);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            box-shadow: inset 1px 1px 0 var(--win-black);
        }

        .win-sunken-thin {
            border-top: 1px solid var(--win-dark);
            border-left: 1px solid var(--win-dark);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
        }

        /* 메뉴바 & 드롭다운 */
        .menubar {
            background-color: var(--win-gray);
            border-bottom: 1px solid #9e9e9e;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
            position: relative;
            z-index: 60;
            flex-shrink: 0;
        }

        .menu-trigger {
            padding: 2px 7px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .menu-trigger:hover {
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-dark);
            border-bottom: 1px solid var(--win-dark);
        }
        .menu-trigger.open {
            border-top: 1px solid var(--win-dark);
            border-left: 1px solid var(--win-dark);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 185px;
            background-color: var(--win-gray);
            border-top: 1px solid var(--win-med);
            border-left: 1px solid var(--win-med);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-dark), 3px 3px 8px rgba(0,0,0,0.35);
            padding: 2px;
            display: none;
            z-index: 200;
        }
        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            padding: 4px 10px 4px 20px;
            font-size: 12px;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
        }
        .dropdown-item:hover:not(:disabled) {
            background-color: #000080;
            color: #ffffff;
        }
        .dropdown-item:disabled {
            color: #777777;
            cursor: default;
        }
        .dropdown-sep {
            height: 0;
            border-top: 1px solid var(--win-dark);
            border-bottom: 1px solid var(--win-light);
            margin: 3px 2px;
        }

        /* 초록색 테이블 (Felt) */
        #felt-area {
            background-color: var(--felt-green);
            background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 0);
            background-size: 12px 12px;
            position: relative;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        /* 7열 카드 그리드: 좌우 여백 완벽 대칭 정중앙 정렬 */
        .solitaire-grid {
            display: grid;
            grid-template-columns: repeat(7, var(--card-w));
            gap: var(--col-gap);
            justify-content: center;
            align-items: start;
            width: 100%;
        }

        /* 빈 슬롯 스타일 */
        .card-slot {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 5px;
            position: relative;
        }

        .slot-outline {
            border: 2px solid rgba(0, 50, 0, 0.55);
            background-color: rgba(0, 65, 0, 0.28);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.32);
        }

        .slot-drop-target {
            outline: 2px dashed #ffff66;
            outline-offset: 2px;
            background-color: rgba(255, 255, 140, 0.16);
        }

        /* 플레잉 카드 공통 스타일 */
        .playing-card {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 5px;
            position: absolute;
            left: 0;
            top: 0;
            background-color: #ffffff;
            border: 1.5px solid #111111;
            box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.38);
            overflow: hidden;
            transition: box-shadow 0.08s ease;
            touch-action: none;
        }

        .playing-card.face-up {
            cursor: grab;
        }
        .playing-card.face-up:active {
            cursor: grabbing;
        }

        /* 선택된 카드 및 힌트 하이라이트 */
        .playing-card.selected-card {
            outline: 3px solid #00ffff;
            box-shadow: 0 0 0 2px #000080, 0 4px 12px rgba(0, 255, 255, 0.65);
            filter: invert(0.06) brightness(1.03);
        }

        .playing-card.hint-highlight,
        .card-slot.hint-highlight {
            outline: 3px solid #ffeb3b;
            box-shadow: 0 0 14px rgba(255, 235, 59, 0.95);
            animation: pulseHint 0.65s ease-in-out 2;
        }

        @keyframes pulseHint {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* 카드 색상 */
        .suit-red {
            color: #df0000;
        }
        .suit-black {
            color: #000000;
        }

        /* 큼직하고 선명한 카드 상단 숫자 + 무늬 헤더 */
        .card-corner-top {
            position: absolute;
            top: var(--corner-pad);
            left: var(--corner-pad);
            right: var(--corner-pad);
            display: flex;
            align-items: center;
            justify-content: space-between;
            line-height: 0.92;
            pointer-events: none;
            z-index: 2;
        }

        .card-rank-text {
            font-family: 'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 900;
            font-size: var(--rank-font);
            line-height: 0.92;
            letter-spacing: -0.03em;
        }
        .card-rank-ten {
            letter-spacing: -0.11em;
            font-size: calc(var(--rank-font) * 0.92);
        }

        .card-suit-small {
            font-size: var(--suit-font);
            line-height: 1;
            font-family: 'Segoe UI Symbol', 'Apple Symbols', sans-serif;
        }

        /* 카드 우하단 역방향 인덱스 (넓은 화면에서 표시) */
        .card-corner-bottom {
            position: absolute;
            bottom: var(--corner-pad);
            right: var(--corner-pad);
            display: flex;
            align-items: center;
            gap: 2px;
            transform: rotate(180deg);
            line-height: 0.92;
            pointer-events: none;
            z-index: 2;
        }

        /* 카드 중앙 큰 무늬 / 궁정 일러스트 영역 */
        .card-center-art {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: calc(var(--rank-font) * 0.65);
            pointer-events: none;
            z-index: 1;
        }

        /* 드래그 중인 플로팅 카드 레이어 */
        #drag-layer {
            position: fixed;
            left: 0;
            top: 0;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        /* 승리 폭포 애니메이션 캔버스 */
        #cascade-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 80;
            display: none;
            cursor: pointer;
        }

        /* 모달 백드롭 */
        .win-modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.32);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .win-modal-backdrop.open {
            display: flex;
        }

        /* 카드 뒷면 선택 썸네일 */
        .deck-back-option {
            border: 2px solid var(--win-dark);
            padding: 3px;
            background: #ffffff;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.1s ease;
        }
        .deck-back-option:hover {
            transform: translateY(-2px);
        }
        .deck-back-option.active {
            border: 3px solid #000080;
            box-shadow: 0 0 0 2px #ffff00;
        }
    </style>
</head>
<body class="p-0 sm:p-2 md:p-3 flex items-center justify-center">

    <!-- 클래식 Windows 카드놀이(Solitaire) 메인 창 -->
    <div id="solitaire-window" class="win-frame w-full h-full max-w-[1060px] max-h-[860px] flex flex-col">

        <!-- 1. 타이틀 바 -->
        <header class="win-titlebar select-none">
            <div class="flex items-center gap-1.5 pl-1">
                <!-- 클래식 카드놀이 아이콘 SVG -->
                <svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" class="shrink-0">
                    <rect x="1" y="2" width="9" height="12" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                    <rect x="5" y="1" width="9" height="12" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                    <path d="M9.5 4 L12 7 L9.5 10 L7 7 Z" fill="#df0000"/>
                </svg>
                <span class="text-[12px] tracking-tight">카드놀이</span>
            </div>
            <div class="flex items-center gap-0.5">
                <button id="btn-win-min" type="button" title="최소화" class="win-ctrl-btn">_</button>
                <button id="btn-win-max" type="button" title="전체창 전환" class="win-ctrl-btn">□</button>
                <button id="btn-win-close" type="button" title="새 게임" class="win-ctrl-btn">×</button>
            </div>
        </header>

        <!-- 2. 상단 클래식 메뉴바 및 빠른 도구 모음 -->
        <nav class="menubar select-none">
            <!-- 게임(G) 드롭다운 -->
            <div class="relative">
                <div id="trigger-game-menu" class="menu-trigger"><u>게임</u>(G)</div>
                <div id="dropdown-game-menu" class="dropdown-menu">
                    <button type="button" data-menu="deal" class="dropdown-item">
                        <span>새 게임(D)</span>
                        <span class="text-[11px] opacity-75 ml-4">F2</span>
                    </button>
                    <div class="dropdown-sep"></div>
                    <button type="button" id="menu-undo" data-menu="undo" class="dropdown-item">
                        <span>실행 취소(U)</span>
                        <span class="text-[11px] opacity-75 ml-4">Z</span>
                    </button>
                    <button type="button" data-menu="backs" class="dropdown-item">
                        <span>카드 뒷면(B)...</span>
                    </button>
                    <button type="button" data-menu="options" class="dropdown-item">
                        <span>옵션(O)...</span>
                    </button>
                    <div class="dropdown-sep"></div>
                    <button type="button" data-menu="cascade-demo" class="dropdown-item">
                        <span>승리 폭포 연출 보기(W)</span>
                    </button>
                </div>
            </div>

            <!-- 도움말(H) 드롭다운 -->
            <div class="relative">
                <div id="trigger-help-menu" class="menu-trigger"><u>도움말</u>(H)</div>
                <div id="dropdown-help-menu" class="dropdown-menu">
                    <button type="button" data-menu="howto" class="dropdown-item">
                        <span>규칙 및 조작법(C)</span>
                        <span class="text-[11px] opacity-75 ml-4">F1</span>
                    </button>
                    <div class="dropdown-sep"></div>
                    <button type="button" data-menu="about" class="dropdown-item">
                        <span>카드놀이 정보(A)...</span>
                    </button>
                </div>
            </div>

            <!-- 구분선 -->
            <div class="h-4 w-[1px] bg-[#808080] border-r border-white mx-1 hidden sm:block"></div>

            <!-- 빠른 실행 클래식 버튼 바 -->
            <div class="flex items-center flex-wrap gap-1 ml-auto sm:ml-0">
                <button id="btn-new-game" type="button" class="win-btn">🃏 새 게임</button>
                <button id="btn-undo" type="button" class="win-btn" disabled>↩ 실행 취소</button>
                <button id="btn-backs" type="button" class="win-btn">🎨 뒷면</button>
                <button id="btn-options" type="button" class="win-btn">⚙ 옵션</button>
                <button id="btn-hint" type="button" class="win-btn">💡 힌트</button>
                <button id="btn-send-up" type="button" class="win-btn" title="올릴 수 있는 카드를 완성 칸으로 올립니다 (초록 배경 우클릭과 동일)">⬆ 카드 올리기</button>
                <button id="btn-autocomplete" type="button" class="win-btn hidden font-bold text-[#000080]">✨ 자동 완성</button>
                <button id="btn-cascade" type="button" class="win-btn">🎆 승리연출</button>
                <button id="btn-sound" type="button" class="win-btn" title="효과음 켜기/끄기">🔊 소리</button>
            </div>
        </nav>

        <!-- 3. 초록색 테이블 메인 게임 보드 영역 -->
        <main id="felt-area" class="win-sunken select-none">
            <!-- 승리 시 카드 폭포(Bouncing Cards Cascade) 캔버스 -->
            <canvas id="cascade-canvas"></canvas>

            <!-- 보드 내부 컨테이너 (좌우 여백 완벽 대칭) -->
            <div id="board-inner" class="w-full mx-auto pt-2.5 sm:pt-4 pb-10 px-2 sm:px-6 flex flex-col items-center">

                <!-- 상단 행: 덱(Stock) + 버린 패(Waste) + 빈칸 + 완성 칸 4개(Foundation 0~3) -->
                <div id="top-row" class="solitaire-grid mb-3 sm:mb-5">
                    <!-- 0열: 덱 (Stock) -->
                    <div id="stock-slot" class="card-slot slot-outline flex items-center justify-center cursor-pointer" title="클릭하여 카드 넘기기 / 다시 뒤집기">
                        <div id="stock-empty-indicator" class="pointer-events-none flex items-center justify-center w-full h-full"></div>
                    </div>

                    <!-- 1열: 버린 패 (Waste - 3장 넘기기 시 우측으로 부채꼴 펼쳐짐) -->
                    <div id="waste-slot" class="card-slot relative" style="overflow: visible;"></div>

                    <!-- 2열: 간격 유지용 투명 슬롯 -->
                    <div class="card-slot pointer-events-none"></div>

                    <!-- 3~6열: 4개의 완성 칸 (Foundations) -->
                    <div id="foundation-0" data-foundation="0" class="card-slot slot-outline foundation-slot flex items-center justify-center">
                        <span class="text-black/25 font-serif font-black text-2xl pointer-events-none">A</span>
                    </div>
                    <div id="foundation-1" data-foundation="1" class="card-slot slot-outline foundation-slot flex items-center justify-center">
                        <span class="text-black/25 font-serif font-black text-2xl pointer-events-none">A</span>
                    </div>
                    <div id="foundation-2" data-foundation="2" class="card-slot slot-outline foundation-slot flex items-center justify-center">
                        <span class="text-black/25 font-serif font-black text-2xl pointer-events-none">A</span>
                    </div>
                    <div id="foundation-3" data-foundation="3" class="card-slot slot-outline foundation-slot flex items-center justify-center">
                        <span class="text-black/25 font-serif font-black text-2xl pointer-events-none">A</span>
                    </div>
                </div>

                <!-- 하단 행: 7열 테이블 (Tableau 0~6) -->
                <div id="tableau-row" class="solitaire-grid" style="min-height: 340px;">
                    <div id="tableau-0" data-tableau="0" class="card-slot slot-outline tableau-slot"></div>
                    <div id="tableau-1" data-tableau="1" class="card-slot slot-outline tableau-slot"></div>
                    <div id="tableau-2" data-tableau="2" class="card-slot slot-outline tableau-slot"></div>
                    <div id="tableau-3" data-tableau="3" class="card-slot slot-outline tableau-slot"></div>
                    <div id="tableau-4" data-tableau="4" class="card-slot slot-outline tableau-slot"></div>
                    <div id="tableau-5" data-tableau="5" class="card-slot slot-outline tableau-slot"></div>
                    <div id="tableau-6" data-tableau="6" class="card-slot slot-outline tableau-slot"></div>
                </div>
            </div>
        </main>

        <!-- 4. 하단 클래식 Windows 상태 표시줄 -->
        <footer id="status-bar" class="bg-[#c0c0c0] px-1.5 py-1 flex items-center justify-between gap-1.5 text-[12px] shrink-0">
            <div id="status-msg" class="win-sunken-thin px-2 py-0.5 flex-1 truncate">
                카드를 드래그하거나 클릭하여 이동하세요. (더블클릭: 완성 칸 이동)
            </div>
            <div id="status-mode" class="win-sunken-thin px-2 py-0.5 hidden sm:block whitespace-nowrap">
                1장 넘기기 · 표준
            </div>
            <div id="status-score-time" class="win-sunken-thin px-2.5 py-0.5 font-bold whitespace-nowrap text-right min-w-[145px]">
                점수: 0 &nbsp; 시간: 0
            </div>
        </footer>
    </div>

    <!-- 드래그 중인 플로팅 카드 묶음 레이어 -->

    <script>
        /**
         * ============================================================================
         * 1. 사운드 합성 엔진 (외부 오디오 파일 없이 동작하는 레트로 Web Audio API)
         * ============================================================================
         */
        class SolitaireAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            ensure() {
                try {
                    if (!this.ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) this.ctx = new AC();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (_) {
                    // 오디오 컨텍스트 제한 환경 안전 무시
                }
            }

            tone(freq, type = 'triangle', dur = 0.055, vol = 0.08, delay = 0) {
                if (!this.enabled) return;
                this.ensure();
                if (!this.ctx) return;

                try {
                    const t = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + dur);
                } catch (_) {}
            }

            flip() {
                this.tone(540, 'triangle', 0.045, 0.07);
                this.tone(760, 'sine', 0.04, 0.05, 0.02);
            }

            place() {
                this.tone(360, 'triangle', 0.05, 0.08);
            }

            foundation(rank = 1) {
                const base = 520 + rank * 34;
                this.tone(base, 'sine', 0.08, 0.09);
                this.tone(base * 1.25, 'triangle', 0.09, 0.07, 0.04);
            }

            deal() {
                [380, 460, 540, 620].forEach((f, i) => this.tone(f, 'triangle', 0.04, 0.06, i * 0.035));
            }

            invalid() {
                this.tone(170, 'sawtooth', 0.09, 0.06);
            }

            winFanfare() {
                const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
                const delays = [0, 0.11, 0.22, 0.34, 0.50, 0.63];
                const durs = [0.1, 0.1, 0.1, 0.16, 0.11, 0.35];
                notes.forEach((n, i) => this.tone(n, 'square', durs[i], 0.07, delays[i]));
            }
        }

        const audio = new SolitaireAudio();

        /**

        /**
         * ============================================================================
         * 3. 게임 상태 및 반응형 메트릭스
         * ============================================================================
         */
        const metrics = {
            cardW: 88,
            cardH: 122,
            colGap: 14,
            faceDownOffset: 10,
            faceUpOffset: 30,
            wasteFanOffset: 24,

        const state = {
            // 옵션 상태
            drawCount: 1,           // 1 또는 3

            won: false,

        const dom = {

        /**
