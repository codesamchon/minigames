         * 4. 반응형 치수 계산 (좌우 여백 100% 대칭 보장)
         * ============================================================================
         */
        let lastFeltWidth = 0;

        function computeResponsiveMetrics() {
            const rawClientW = dom.feltArea.clientWidth || Math.min(window.innerWidth, 980);
            lastFeltWidth = rawClientW;
            const isMobile = window.innerWidth < 560;
            const sidePad = isMobile ? 8 : 24;
            const gap = isMobile ? 5 : 14;
            const availW = Math.max(276, rawClientW - sidePad * 2);
            const rawCardW = Math.floor((availW - gap * 6) / 7);
            const cardW = Math.max(38, Math.min(rawCardW, 102));
            const cardH = Math.round(cardW * 1.38);

            // 사용자가 요청한 크고 굵은 숫자 폰트 + 카드 겹침 시 절대 가려지지 않는 오프셋 계산
            const topRankPx = Math.max(15, Math.round(cardW * 0.34));
            const topSuitPx = Math.max(12, Math.round(cardW * 0.24));
            const cornerPad = cardW < 52 ? 2 : 5;

            metrics.cardW = cardW;
            metrics.cardH = cardH;
            metrics.colGap = gap;
            metrics.faceDownOffset = Math.max(6, Math.round(cardH * 0.09));
            metrics.faceUpOffset = Math.max(topRankPx + cornerPad * 2 + 4, Math.round(cardH * 0.28));
            metrics.wasteFanOffset = Math.max(16, Math.round(cardW * 0.29));
            metrics.showBottomCorner = cardW >= 62;

            const root = document.documentElement.style;
            root.setProperty('--card-w', `${cardW}px`);
            root.setProperty('--card-h', `${cardH}px`);
            root.setProperty('--col-gap', `${gap}px`);
            root.setProperty('--rank-font', `${topRankPx}px`);
            root.setProperty('--suit-font', `${topSuitPx}px`);
            root.setProperty('--corner-pad', `${cornerPad}px`);
        }

        /**
         * ============================================================================
         * 5. 카드 HTML 생성 및 보드 렌더링
         * ============================================================================
         */
        function getBackSvgById(id) {
            const found = CARD_BACK_DESIGNS.find(b => b.id === id) || CARD_BACK_DESIGNS[0];
            return found.svg;
        }

        // 카드 중앙 아트워크 (크고 또렷한 문양 및 J/Q/K 왕실 일러스트)
        function buildCardCenterArt(card) {
            const suitObj = SUITS.find(s => s.id === card.suit);
            const sym = suitObj.symbol;
            const isRed = suitObj.color === 'red';
            const strokeColor = isRed ? '#b91c1c' : '#1e293b';
            const fillAccent = isRed ? '#ef4444' : '#334155';

            if (card.rank === 1) {
                const sz = Math.round(metrics.cardW * 0.54);
                return `<span style="font-size:${sz}px; line-height:1;">${sym}</span>`;
            }

            if (card.rank >= 11) {
                const crownTitle = card.rank === 11 ? 'JACK' : card.rank === 12 ? 'QUEEN' : 'KING';
                const crownColor = '#f59e0b';
                return `
                    <div class="w-[74%] h-[58%] border border-current/35 rounded-sm bg-amber-50/60 flex flex-col items-center justify-center relative overflow-hidden">
                        <svg viewBox="0 0 48 44" class="w-[82%] h-[78%]">
                            <path d="M10 16 L16 7 L24 14 L32 7 L38 16 Z" fill="${crownColor}" stroke="#78350f" stroke-width="1.2"/>
                            <circle cx="24" cy="24" r="7" fill="#fde68a" stroke="${strokeColor}" stroke-width="1.3"/>
                            <path d="M12 42 Q24 31 36 42 Z" fill="${fillAccent}"/>
                        </svg>
                        <span style="font-size:${Math.max(8, Math.round(metrics.cardW * 0.11))}px" class="font-bold tracking-tighter opacity-75 leading-none pb-0.5">${crownTitle}</span>
                    </div>
                `;
            }

            const bigSymPx = Math.round(metrics.cardW * 0.44);
            return `<span style="font-size:${bigSymPx}px; line-height:1; opacity:0.92;">${sym}</span>`;
        }

        function createCardElement(card) {
            const el = document.createElement('div');
            el.className = 'playing-card ' + (card.faceUp ? 'face-up' : 'face-down');
            el.dataset.cardId = card.id;

            if (!card.faceUp) {
                el.innerHTML = getBackSvgById(state.cardBackId);
                return el;
            }

            const suitObj = SUITS.find(s => s.id === card.suit);
            const colorClass = suitObj.color === 'red' ? 'suit-red' : 'suit-black';
            const rankStr = RANK_LABELS[card.rank];
            const tenClass = card.rank === 10 ? ' card-rank-ten' : '';

            el.classList.add(colorClass);

            const bottomHtml = metrics.showBottomCorner ? `
                <div class="card-corner-bottom">
                    <span class="card-rank-text${tenClass}">${rankStr}</span>
                    <span class="card-suit-small">${suitObj.symbol}</span>
                </div>
            ` : '';

            el.innerHTML = `
                <div class="card-corner-top">
                    <span class="card-rank-text${tenClass}">${rankStr}</span>
                    <span class="card-suit-small">${suitObj.symbol}</span>
                </div>
                <div class="card-center-art">
                    ${buildCardCenterArt(card)}
                </div>
                ${bottomHtml}
            `;

            return el;
        }

        // 베가스 규칙 등에서 덱 재순환 가능 여부 확인
        function canRecycleStock() {
            if (state.waste.length === 0) return false;
            if (state.scoringMode === 'vegas') {
                const maxPasses = state.drawCount === 1 ? 1 : 3;
                return state.stockPassCount < maxPasses;
            }
            return true;
        }

        function renderStockAndWaste() {
            // 기존 카드 제거 (빈 표시 아이콘은 유지)
            Array.from(dom.stockSlot.querySelectorAll('.playing-card')).forEach(n => n.remove());
            dom.wasteSlot.innerHTML = '';

            if (state.stock.length > 0) {
                dom.stockIndicator.innerHTML = '';
                // 입체적인 덱 두께 표현 (최대 3겹)
                const layers = Math.min(3, Math.ceil(state.stock.length / 8));
                for (let i = 0; i < layers; i++) {
                    const topCard = state.stock[state.stock.length - 1];
                    const cardEl = createCardElement({ ...topCard, faceUp: false });
                    cardEl.style.left = `${i * 2}px`;
                    cardEl.style.top = `${i * 1.5}px`;
                    cardEl.style.pointerEvents = 'none';
                    dom.stockSlot.appendChild(cardEl);
                }
            } else {
                // 패가 비었을 때: 재순환 가능하면 클래식 초록색 O, 불가능하면 빨간색 X
                if (state.waste.length === 0 || canRecycleStock()) {
                    dom.stockIndicator.innerHTML = `
                        <svg width="44%" height="44%" viewBox="0 0 40 40">
                            <circle cx="20" cy="20" r="14" fill="none" stroke="#00e640" stroke-width="5"/>
                        </svg>`;
                } else {
                    dom.stockIndicator.innerHTML = `
                        <svg width="44%" height="44%" viewBox="0 0 40 40">
                            <path d="M10 10 L30 30 M30 10 L10 30" stroke="#ff2a2a" stroke-width="5" stroke-linecap="round"/>
                        </svg>`;
                }
            }

            // 버린 패(Waste) 렌더링 (3장 넘기기 시 최대 3장 우측 부채꼴 펼침)
            if (state.waste.length > 0) {
                const fanCount = state.drawCount === 3 ? Math.min(3, state.waste.length) : 1;
                const startIdx = state.waste.length - fanCount;

                for (let i = startIdx; i < state.waste.length; i++) {
                    const card = state.waste[i];
                    const fanPos = i - startIdx;
                    const isTop = (i === state.waste.length - 1);
                    const el = createCardElement(card);

                    el.style.left = `${fanPos * metrics.wasteFanOffset}px`;
                    el.style.top = `0px`;
                    el.style.zIndex = String(10 + fanPos);
                    el.dataset.zone = 'waste';
                    el.dataset.cardIndex = String(i);

                    if (!isTop) {
                        el.style.pointerEvents = 'none';
                    } else if (isCardSelected('waste', 0, i)) {
                        el.classList.add('selected-card');
                    }

                    dom.wasteSlot.appendChild(el);
                }
            }
        }

        function renderFoundations() {
            for (let f = 0; f < 4; f++) {
                const slot = dom.foundationSlots[f];
                Array.from(slot.querySelectorAll('.playing-card')).forEach(n => n.remove());

                const pile = state.foundations[f];
                if (pile.length > 0) {
                    const topIdx = pile.length - 1;
                    const topCard = pile[topIdx];
                    const el = createCardElement(topCard);
                    el.dataset.zone = 'foundation';
                    el.dataset.colIndex = String(f);
                    el.dataset.cardIndex = String(topIdx);
                    if (isCardSelected('foundation', f, topIdx)) {
                        el.classList.add('selected-card');
                    }
                    slot.appendChild(el);
                }
            }
        }

        function renderTableau() {
            let maxColHeight = 300;

            for (let col = 0; col < 7; col++) {
                const slot = dom.tableauSlots[col];
                slot.innerHTML = '';

                const pile = state.tableau[col];
                let currentY = 0;

                for (let idx = 0; idx < pile.length; idx++) {
                    const card = pile[idx];
                    const el = createCardElement(card);
                    el.style.top = `${currentY}px`;
                    el.style.zIndex = String(idx + 1);
                    el.dataset.zone = 'tableau';
                    el.dataset.colIndex = String(col);
                    el.dataset.cardIndex = String(idx);

                    if (isCardSelected('tableau', col, idx)) {
                        el.classList.add('selected-card');
                    }

                    slot.appendChild(el);

                    if (idx < pile.length - 1) {
                        currentY += card.faceUp ? metrics.faceUpOffset : metrics.faceDownOffset;
                    }
                }

                const colTotalH = currentY + metrics.cardH + 28;
                if (colTotalH > maxColHeight) maxColHeight = colTotalH;
            }

            dom.tableauRow.style.minHeight = `${maxColHeight}px`;
        }

        function updateStatusAndButtons() {
            dom.statusBar.style.display = state.showStatusBar ? 'flex' : 'none';

            const drawText = state.drawCount === 1 ? '1장 넘기기' : '3장 넘기기';
            const scoreModeText =
                state.scoringMode === 'standard' ? '표준' :
                state.scoringMode === 'vegas' ? '베가스' : '점수 없음';
            dom.statusMode.textContent = `${drawText} · ${scoreModeText}`;

            let scorePart = '';
            if (state.scoringMode === 'standard') {
                scorePart = `점수: ${state.score}`;
            } else if (state.scoringMode === 'vegas') {
                const sign = state.score < 0 ? '-' : '';
                scorePart = `금액: ${sign}$${Math.abs(state.score)}`;
            }

            const timePart = state.timedGame ? `시간: ${state.seconds}` : '';
            dom.statusScoreTime.textContent = [scorePart, timePart].filter(Boolean).join('   ') || '자유 플레이';

            const canUndo = state.undoStack.length > 0 && !state.won;
            dom.btnUndo.disabled = !canUndo;
            dom.menuUndo.disabled = !canUndo;

            // 자동 완성 가능 여부 검사 (테이블에 뒷면 카드가 하나도 없고 패 순환 제약이 없을 때)
            const canAuto = checkCanAutoComplete();
            dom.btnAutoComplete.classList.toggle('hidden', !canAuto);
        }

        function renderAll() {
            renderStockAndWaste();
            renderFoundations();
            renderTableau();
            updateStatusAndButtons();
        }

        function setStatusMessage(msg) {
            dom.statusMsg.textContent = msg;
        }

        /**
         * ============================================================================
         * 6. 클론다이크 규칙 검증, 점수, 타이머, 실행 취소(Undo)
         * ============================================================================
         */
        function getSuitColor(suit) {
            return (suit === 'hearts' || suit === 'diamonds') ? 'red' : 'black';
        }

        // 완성 칸(Foundation) 이동 가능 여부: 같은 무늬 오름차순 (A -> 2 -> ... -> K)
        function canMoveToFoundation(card, fIdx) {
            if (!card || !card.faceUp) return false;
            const pile = state.foundations[fIdx];
            if (pile.length === 0) {
                return card.rank === 1;
            }
            const top = pile[pile.length - 1];
            return top.suit === card.suit && card.rank === top.rank + 1;
        }

        // 테이블(Tableau) 이동 가능 여부: 교차 색상 내림차순 (빈 칸에는 K만 가능)
        function canMoveToTableau(leadCard, colIdx) {
            if (!leadCard || !leadCard.faceUp) return false;
            const pile = state.tableau[colIdx];
            if (pile.length === 0) {
                return leadCard.rank === 13;
            }
            const top = pile[pile.length - 1];
            if (!top.faceUp) return false;
            return getSuitColor(leadCard.suit) !== getSuitColor(top.suit) && leadCard.rank === top.rank - 1;
        }

        function addStandardScore(delta) {
            if (state.scoringMode !== 'standard') return;
            state.score = Math.max(0, state.score + delta);
        }

        function ensureTimerRunning() {
            if (state.timerStarted || state.won) return;
            state.timerStarted = true;
            if (!state.timedGame) return;

            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (state.won) return;
                state.seconds++;
                // 오리지널 Windows 카드놀이 규칙: 표준 점수 + 타이머 사용 시 10초마다 -2점
                if (state.scoringMode === 'standard' && state.seconds % 10 === 0) {
                    addStandardScore(-2);
                }
                updateStatusAndButtons();
            }, 1000);
        }

        function stopGameTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        // 스냅샷 기반 다단계 실행 취소(Undo) 저장
        function cloneCards(arr) {
            return arr.map(c => ({ ...c }));
        }

        function saveUndoSnapshot() {
            state.undoStack.push({
                stock: cloneCards(state.stock),
                waste: cloneCards(state.waste),
                foundations: state.foundations.map(cloneCards),
                tableau: state.tableau.map(cloneCards),
                score: state.score,
                stockPassCount: state.stockPassCount
            });
            if (state.undoStack.length > 80) {
                state.undoStack.shift();
            }
        }

        function undoMove() {
            if (state.undoStack.length === 0 || state.won) return;
            const snap = state.undoStack.pop();
            state.stock = snap.stock;
            state.waste = snap.waste;
            state.foundations = snap.foundations;
            state.tableau = snap.tableau;
            state.score = snap.score;
            state.stockPassCount = snap.stockPassCount;
            state.selected = null;

            audio.flip();
            setStatusMessage('이전 이동을 실행 취소했습니다.');
            renderAll();
        }

        /**
         * ============================================================================
         * 7. 새 게임 배분, 덱 넘기기, 카드 이동 실행 및 승리 판정
         * ============================================================================
         */
        function buildShuffledDeck() {
            const deck = [];
            let idCounter = 1;
            for (const s of SUITS) {
                for (let r = 1; r <= 13; r++) {
                    deck.push({
                        id: `c${idCounter++}`,
                        suit: s.id,
                        rank: r,
                        faceUp: false
                    });
                }
            }
            // Fisher-Yates 셔플
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startNewGame(silent = false) {
            if (cascadeController.running) {
                cascadeController.stop();
            }
            stopGameTimer();

            const deck = buildShuffledDeck();
            state.foundations = [[], [], [], []];
            state.tableau = [[], [], [], [], [], [], []];
            state.waste = [];
            state.undoStack = [];
            state.selected = null;
            state.seconds = 0;
            state.timerStarted = false;
            state.stockPassCount = 1;
            state.won = false;

            // 점수 초기화 (베가스 모드는 -$52 시작, 누적 옵션 지원)
            if (state.scoringMode === 'vegas') {
                state.score = (state.vegasKeepCumulative ? state.vegasBank : 0) - 52;
                state.vegasBank = state.score;
            } else {
                state.score = 0;
                state.vegasBank = 0;
            }

            // 7열 테이블 배분 (i번째 열에 i+1장, 맨 위 1장만 앞면)
            for (let col = 0; col < 7; col++) {
                for (let row = 0; row <= col; row++) {
                    const card = deck.pop();
                    card.faceUp = (row === col);
                    state.tableau[col].push(card);
                }
            }

            // 남은 24장은 덱(Stock)으로
            state.stock = deck;

            computeResponsiveMetrics();
            renderAll();
            setStatusMessage('새 게임을 시작했습니다. 행운을 빕니다!');
            if (!silent) audio.deal();
        }

        // 덱(Stock) 클릭 처리: 카드 넘기기 또는 버린 패 뒤집어 재사용
        function handleStockClick() {
            if (state.won || cascadeController.running) return;
            state.selected = null;
            ensureTimerRunning();

            if (state.stock.length > 0) {
                saveUndoSnapshot();
                const count = Math.min(state.drawCount, state.stock.length);
                for (let i = 0; i < count; i++) {
                    const card = state.stock.pop();
                    card.faceUp = true;
                    state.waste.push(card);
                }
                audio.flip();
                setStatusMessage(`${count}장의 카드를 넘겼습니다.`);
                renderAll();
                return;
            }

            // 덱이 비어있을 때 재순환
            if (state.waste.length === 0) {
                setStatusMessage('더 이상 넘길 카드가 없습니다.');
                return;
            }

            if (!canRecycleStock()) {
                audio.invalid();
                setStatusMessage('베가스 규칙에서는 더 이상 덱을 다시 뒤집을 수 없습니다.');
                return;
            }

            saveUndoSnapshot();
            state.stockPassCount++;

            // 오리지널 Windows 표준 점수 감점 규칙:
            // 1장 넘기기: 재순환 시 -100점 / 3장 넘기기: 4회차 순환부터 -20점
            if (state.scoringMode === 'standard') {
                if (state.drawCount === 1 && state.stockPassCount >= 2) {
                    addStandardScore(-100);
                } else if (state.drawCount === 3 && state.stockPassCount >= 4) {
                    addStandardScore(-20);
                }
            }

            while (state.waste.length > 0) {
                const c = state.waste.pop();
                c.faceUp = false;
                state.stock.push(c);
            }

            audio.flip();
            setStatusMessage('버린 패를 다시 뒤집어 덱으로 가져왔습니다.');
            renderAll();
        }

        // 출발지에서 카드 묶음 가져오기 (실제 제거 전 조회)
        function getSourceCards(src) {
            if (src.zone === 'waste') {
                if (state.waste.length === 0) return [];
                return [state.waste[state.waste.length - 1]];
            }
            if (src.zone === 'foundation') {
                const pile = state.foundations[src.colIndex];
                if (!pile || pile.length === 0) return [];
                return [pile[pile.length - 1]];
            }
            if (src.zone === 'tableau') {
                const pile = state.tableau[src.colIndex];
                if (!pile || src.cardIndex < 0 || src.cardIndex >= pile.length) return [];
                return pile.slice(src.cardIndex);
            }
            return [];
        }

        // 카드 이동 실행 (유효하면 이동 + 점수 반영 + 뒷면 자동 뒤집기 + 승리 검사)
        function attemptMove(src, dest) {
            if (state.won) return false;
            const movingCards = getSourceCards(src);
            if (movingCards.length === 0 || !movingCards[0].faceUp) return false;

            // 같은 위치로 이동 시 무시
            if (src.zone === dest.zone && src.colIndex === dest.colIndex) return false;

            const leadCard = movingCards[0];

            // 목적지 검증
            if (dest.zone === 'foundation') {
                if (movingCards.length !== 1) return false;
                if (!canMoveToFoundation(leadCard, dest.colIndex)) return false;
            } else if (dest.zone === 'tableau') {
                if (!canMoveToTableau(leadCard, dest.colIndex)) return false;
            } else {
                return false;
            }

            ensureTimerRunning();
            saveUndoSnapshot();

            // 출발지에서 제거
            if (src.zone === 'waste') {
                state.waste.pop();
            } else if (src.zone === 'foundation') {
                state.foundations[src.colIndex].pop();
            } else if (src.zone === 'tableau') {
                state.tableau[src.colIndex].splice(src.cardIndex);
            }

            // 목적지에 추가
            if (dest.zone === 'foundation') {
                state.foundations[dest.colIndex].push(leadCard);
            } else {
                state.tableau[dest.colIndex].push(...movingCards);
            }

            // 점수 계산 (정통 Windows 클론다이크 공식)
            if (state.scoringMode === 'standard') {
                if (src.zone === 'waste' && dest.zone === 'tableau') addStandardScore(5);
                else if (src.zone === 'waste' && dest.zone === 'foundation') addStandardScore(10);
                else if (src.zone === 'tableau' && dest.zone === 'foundation') addStandardScore(10);
                else if (src.zone === 'foundation' && dest.zone === 'tableau') addStandardScore(-15);
            } else if (state.scoringMode === 'vegas') {
                if (dest.zone === 'foundation' && src.zone !== 'foundation') {
                    state.score += 5;
                    state.vegasBank = state.score;
                } else if (src.zone === 'foundation' && dest.zone === 'tableau') {
                    state.score -= 5;
                    state.vegasBank = state.score;
                }
            }

            // 출발지 테이블 맨 위 카드가 뒷면이면 자동으로 앞면 뒤집기 (+5점)
            if (src.zone === 'tableau') {
                const remain = state.tableau[src.colIndex];
                if (remain.length > 0 && !remain[remain.length - 1].faceUp) {
                    remain[remain.length - 1].faceUp = true;
                    addStandardScore(5);
                }
            }

            state.selected = null;

            if (dest.zone === 'foundation') {
                audio.foundation(leadCard.rank);
                setStatusMessage(`${RANK_LABELS[leadCard.rank]} 카드를 완성 칸에 올렸습니다.`);
            } else {
                audio.place();
                setStatusMessage('카드를 이동했습니다.');
            }

            renderAll();
            checkVictoryCondition();
            return true;
        }

        // 완성 칸 4개에 총 52장이 모두 모였는지 검사
        function checkVictoryCondition() {
            const totalInFoundations = state.foundations.reduce((acc, f) => acc + f.length, 0);
            if (totalInFoundations !== 52 || state.won) return;

            state.won = true;
            stopGameTimer();

            // 오리지널 Windows 시간 보너스: 30초 이상 소요된 표준 타이머 게임 시 700,000 / 초
            let bonus = 0;
            if (state.scoringMode === 'standard' && state.timedGame && state.seconds >= 30) {
                bonus = Math.floor(700000 / state.seconds);
                state.score += bonus;
            } else if (state.scoringMode === 'standard' && state.timedGame && state.seconds > 0 && state.seconds < 30) {
                bonus = Math.floor(700000 / 30);
                state.score += bonus;
            }

            updateStatusAndButtons();
            audio.winFanfare();
            setStatusMessage('🎉 축하합니다! 승리하셨습니다! (화면을 클릭하면 폭포 연출을 종료합니다)');

            // 전설적인 승리 카드 폭포 애니메이션 시작!
            setTimeout(() => {
                cascadeController.start(bonus);
            }, 260);
        }

        /**
         * ============================================================================
         * 8. 편의 기능: 더블클릭 이동, 우클릭 일괄 올리기, 자동 완성, 힌트
         * ============================================================================
         */
        function tryMoveSingleCardToAnyFoundation(src) {
            const cards = getSourceCards(src);
            if (cards.length !== 1) return false;
            for (let f = 0; f < 4; f++) {
                if (canMoveToFoundation(cards[0], f)) {
                    return attemptMove(src, { zone: 'foundation', colIndex: f });
                }
            }
            return false;
        }

        // 초록색 바탕 우클릭 또는 [⬆ 카드 올리기] 버튼: 올릴 수 있는 맨 위 카드를 연쇄적으로 완성 칸에 이동
        function sendAllEligibleCardsUp() {
            if (state.won || cascadeController.running) return;
            let movedCount = 0;
            let keepChecking = true;

            while (keepChecking && !state.won) {
                keepChecking = false;

                if (state.waste.length > 0) {
                    const wIdx = state.waste.length - 1;
                    if (tryMoveSingleCardToAnyFoundation({ zone: 'waste', colIndex: 0, cardIndex: wIdx })) {
                        movedCount++;
                        keepChecking = true;
                        continue;
                    }
                }

                for (let c = 0; c < 7; c++) {
                    const pile = state.tableau[c];
                    if (pile.length > 0) {
                        const topIdx = pile.length - 1;
                        if (tryMoveSingleCardToAnyFoundation({ zone: 'tableau', colIndex: c, cardIndex: topIdx })) {
                            movedCount++;
                            keepChecking = true;
                            break;
                        }
                    }
                }
            }

            if (movedCount === 0) {
                setStatusMessage('현재 바로 완성 칸으로 올릴 수 있는 카드가 없습니다.');
            } else {
                setStatusMessage(`${movedCount}장의 카드를 완성 칸으로 올렸습니다!`);
            }
        }

        // 자동 완성 활성화 조건: 테이블의 모든 카드가 앞면이고, 덱/버린 패가 비어 있을 때
        function checkCanAutoComplete() {
            if (state.won) return false;
            if (state.stock.length > 0 || state.waste.length > 0) return false;
            for (let c = 0; c < 7; c++) {
                for (const card of state.tableau[c]) {
                    if (!card.faceUp) return false;
                }
            }
            const remaining = state.tableau.reduce((s, col) => s + col.length, 0);
            return remaining > 0;
        }

        let autoCompleting = false;
        function runAutoComplete() {
            if (autoCompleting || state.won) return;
            autoCompleting = true;
            setStatusMessage('✨ 자동 완성을 진행 중입니다...');

            const step = () => {
                if (state.won) {
                    autoCompleting = false;
                    return;
                }
                let moved = false;
                for (let c = 0; c < 7; c++) {
                    const pile = state.tableau[c];
                    if (pile.length > 0) {
                        if (tryMoveSingleCardToAnyFoundation({ zone: 'tableau', colIndex: c, cardIndex: pile.length - 1 })) {
                            moved = true;
                            break;
                        }
                    }
                }
                if (moved && !state.won) {
                    setTimeout(step, 65);
                } else {
                    autoCompleting = false;
                }
            };
            step();
        }

        // 힌트 탐색기
        function showHint() {
            if (state.won || cascadeController.running) return;
            document.querySelectorAll('.hint-highlight').forEach(el => el.classList.remove('hint-highlight'));

            // 1순위: Waste 또는 Tableau 맨 위 -> Foundation
            if (state.waste.length > 0) {
                const top = state.waste[state.waste.length - 1];
                for (let f = 0; f < 4; f++) {
                    if (canMoveToFoundation(top, f)) {
                        highlightHint(dom.wasteSlot.lastElementChild, dom.foundationSlots[f]);
                        setStatusMessage(`힌트: 버린 패의 ${RANK_LABELS[top.rank]} 카드를 완성 칸으로 올리세요.`);
                        return;
                    }
                }
            }

            for (let c = 0; c < 7; c++) {
                const pile = state.tableau[c];
                if (pile.length > 0) {
                    const top = pile[pile.length - 1];
                    for (let f = 0; f < 4; f++) {
                        if (canMoveToFoundation(top, f)) {
                            highlightHint(dom.tableauSlots[c].lastElementChild, dom.foundationSlots[f]);
                            setStatusMessage(`힌트: ${c + 1}열의 ${RANK_LABELS[top.rank]} 카드를 완성 칸으로 올리세요.`);
                            return;
                        }
                    }
                }
            }

            // 2순위: 뒷면 카드를 열거나 새 열을 활용하는 유효한 Tableau 간 이동
            for (let c = 0; c < 7; c++) {
                const pile = state.tableau[c];
                const firstUpIdx = pile.findIndex(card => card.faceUp);
                if (firstUpIdx === -1) continue;
                const lead = pile[firstUpIdx];

                // 이미 빈 열 바닥에 있는 K를 다른 빈 열로 옮기는 무의미한 힌트 방지
                for (let targetCol = 0; targetCol < 7; targetCol++) {
                    if (targetCol === c) continue;
                    if (lead.rank === 13 && firstUpIdx === 0 && state.tableau[targetCol].length === 0) continue;
                    if (canMoveToTableau(lead, targetCol)) {
                        const srcCardEl = dom.tableauSlots[c].children[firstUpIdx];
                        const destEl = state.tableau[targetCol].length > 0
                            ? dom.tableauSlots[targetCol].lastElementChild
                            : dom.tableauSlots[targetCol];
                        highlightHint(srcCardEl, destEl);
                        setStatusMessage(`힌트: ${c + 1}열의 ${RANK_LABELS[lead.rank]} 묶음을 ${targetCol + 1}열로 옮기세요.`);
                        return;
                    }
                }
            }

            // 3순위: Waste -> Tableau
            if (state.waste.length > 0) {
                const top = state.waste[state.waste.length - 1];
                for (let targetCol = 0; targetCol < 7; targetCol++) {
                    if (canMoveToTableau(top, targetCol)) {
                        const destEl = state.tableau[targetCol].length > 0
                            ? dom.tableauSlots[targetCol].lastElementChild
                            : dom.tableauSlots[targetCol];
                        highlightHint(dom.wasteSlot.lastElementChild, destEl);
                        setStatusMessage(`힌트: 버린 패의 ${RANK_LABELS[top.rank]} 카드를 ${targetCol + 1}열로 옮기세요.`);
                        return;
                    }
                }
            }

            // 4순위: 덱 넘기기 안내
            if (state.stock.length > 0 || canRecycleStock()) {
                highlightHint(dom.stockSlot, null);
                setStatusMessage('힌트: 좌측 상단 덱을 클릭해 새로운 카드를 확인하세요.');
            } else {
                setStatusMessage('더 이상 추천할 이동이 없습니다. 실행 취소나 새 게임을 이용해 보세요.');
            }
        }

        function highlightHint(el1, el2) {
            if (el1) el1.classList.add('hint-highlight');
            if (el2) el2.classList.add('hint-highlight');
            setTimeout(() => {
                if (el1) el1.classList.remove('hint-highlight');
                if (el2) el2.classList.remove('hint-highlight');
            }, 1400);
        }

        /**
         * ============================================================================
         * 9. 마우스 & 터치 통합 포인터 조작 (드래그 앤 드롭 + 클릭 선택 이동 + 더블클릭)
         * ============================================================================
         */
        function isCardSelected(zone, colIndex, cardIndex) {
            if (!state.selected) return false;
            if (state.selected.zone !== zone) return false;
            if (zone === 'waste') return state.selected.cardIndex === cardIndex;
            if (zone === 'foundation') return state.selected.colIndex === colIndex;
            if (zone === 'tableau') {
                return state.selected.colIndex === colIndex && cardIndex >= state.selected.cardIndex;
            }
            return false;
        }

        const dragState = {
            active: false,
            moved: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            offsetX: 0,
            offsetY: 0,
            src: null,
            sourceEls: [],
            lastTapTime: 0,
            lastTapCardId: null
        };

        function clearDropHighlights() {
            document.querySelectorAll('.slot-drop-target').forEach(el => el.classList.remove('slot-drop-target'));
        }

        // 드래그 중 놓을 수 있는 최적의 슬롯 판별
        function findBestDropTarget(clientX, clientY, movingCount, leadCard) {
            const dragRect = {
                left: clientX - dragState.offsetX,
                top: clientY - dragState.offsetY,
                right: clientX - dragState.offsetX + metrics.cardW,
                bottom: clientY - dragState.offsetY + metrics.cardH
            };

            let best = null;
            let bestArea = 0;

            const overlapArea = (a, b) => {
                const xOverlap = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
                const yOverlap = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
                return xOverlap * yOverlap;
            };

            if (movingCount === 1) {
                for (let f = 0; f < 4; f++) {
                    if (!canMoveToFoundation(leadCard, f)) continue;
                    const r = dom.foundationSlots[f].getBoundingClientRect();
                    const area = overlapArea(dragRect, r);
                    if (area > bestArea) {
                        bestArea = area;
                        best = { zone: 'foundation', colIndex: f, highlightEl: dom.foundationSlots[f] };
                    }
                }
            }

            for (let c = 0; c < 7; c++) {
                if (dragState.src && dragState.src.zone === 'tableau' && dragState.src.colIndex === c) continue;
                if (!canMoveToTableau(leadCard, c)) continue;

                const slotEl = dom.tableauSlots[c];
                const targetEl = slotEl.lastElementChild || slotEl;
                const r = targetEl.getBoundingClientRect();
                // 열 전체 영역도 일부 허용하여 드롭 판정을 쾌적하게 보정
                const expanded = { left: r.left - 8, top: r.top - 10, right: r.right + 8, bottom: r.bottom + 45 };
                const area = overlapArea(dragRect, expanded);
                if (area > bestArea) {
                    bestArea = area;
                    best = { zone: 'tableau', colIndex: c, highlightEl: slotEl };
                }
            }

            return best;
        }

        // 덱 슬롯 클릭 이벤트
        dom.stockSlot.addEventListener('click', (e) => {
            e.stopPropagation();
            handleStockClick();
        });

        // 초록색 테이블 우클릭 시 카드 일괄 올리기
        dom.feltArea.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            sendAllEligibleCardsUp();
        });

        // 보드 포인터 다운 (카드 드래그 준비 또는 빈 슬롯 클릭 이동)
        dom.feltArea.addEventListener('pointerdown', (e) => {
            closeAllMenus();
            if (state.won || cascadeController.running || autoCompleting) return;
            if (e.button !== 0 && e.pointerType === 'mouse') return;

            const cardEl = e.target.closest('.playing-card');

            // 빈 슬롯(완성 칸 또는 빈 테이블 열)을 클릭한 경우: 선택된 카드가 있으면 이동 시도
            if (!cardEl) {
                const fSlot = e.target.closest('.foundation-slot');
                const tSlot = e.target.closest('.tableau-slot');
                if (state.selected && fSlot) {
                    const fIdx = parseInt(fSlot.dataset.foundation, 10);
                    if (!attemptMove(state.selected, { zone: 'foundation', colIndex: fIdx })) {
                        state.selected = null;
                        renderAll();
                    }
                    return;
                }
                if (state.selected && tSlot) {
                    const cIdx = parseInt(tSlot.dataset.tableau, 10);
                    if (!attemptMove(state.selected, { zone: 'tableau', colIndex: cIdx })) {
                        state.selected = null;
                        renderAll();
                    }
                    return;
                }
                if (!e.target.closest('#stock-slot') && state.selected) {
                    state.selected = null;
                    renderAll();
                }
                return;
            }

            const zone = cardEl.dataset.zone;
            if (!zone) return;

            const colIndex = parseInt(cardEl.dataset.colIndex || '0', 10);
            const cardIndex = parseInt(cardEl.dataset.cardIndex || '0', 10);
            const src = { zone, colIndex, cardIndex };
            const cards = getSourceCards(src);

            // 뒷면 카드 클릭 시 (혹시 수동 뒤집기가 필요한 경우 방어 처리)
            if (cards.length === 0 || !cards[0].faceUp) {
                if (zone === 'tableau') {
                    const pile = state.tableau[colIndex];
                    if (cardIndex === pile.length - 1 && !pile[cardIndex].faceUp) {
                        saveUndoSnapshot();
                        pile[cardIndex].faceUp = true;
                        addStandardScore(5);
                        audio.flip();
                        renderAll();
                    }
                }
                return;
            }

            // 드래그 시작 준비
            const rect = cardEl.getBoundingClientRect();
            dragState.active = true;
            dragState.moved = false;
            dragState.pointerId = e.pointerId;
            dragState.startX = e.clientX;
            dragState.startY = e.clientY;
            dragState.offsetX = e.clientX - rect.left;
            dragState.offsetY = e.clientY - rect.top;
            dragState.src = src;

            if (zone === 'tableau') {
                const slot = dom.tableauSlots[colIndex];
                dragState.sourceEls = Array.from(slot.children).slice(cardIndex);
            } else {
                dragState.sourceEls = [cardEl];
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!dragState.active || e.pointerId !== dragState.pointerId) return;

            const dx = e.clientX - dragState.startX;
            const dy = e.clientY - dragState.startY;

            if (!dragState.moved && Math.hypot(dx, dy) > 6) {
                dragState.moved = true;
                // 플로팅 드래그 레이어 구성
                dom.dragLayer.innerHTML = '';
                const cards = getSourceCards(dragState.src);
                cards.forEach((c, i) => {
                    const cloneEl = createCardElement(c);
                    cloneEl.style.top = `${i * metrics.faceUpOffset}px`;
                    cloneEl.style.boxShadow = '4px 8px 18px rgba(0,0,0,0.48)';
                    dom.dragLayer.appendChild(cloneEl);
                });
                dom.dragLayer.style.display = 'block';
                dragState.sourceEls.forEach(el => { el.style.visibility = 'hidden'; });
            }

            if (dragState.moved) {
                e.preventDefault();
                const x = e.clientX - dragState.offsetX;
                const y = e.clientY - dragState.offsetY;
                dom.dragLayer.style.transform = `translate3d(${x}px, ${y}px, 0)`;

                clearDropHighlights();
                const cards = getSourceCards(dragState.src);
                if (cards.length > 0) {
                    const best = findBestDropTarget(e.clientX, e.clientY, cards.length, cards[0]);
                    if (best && best.highlightEl) {
                        best.highlightEl.classList.add('slot-drop-target');
                    }
                }
            }
        }, { passive: false });

        window.addEventListener('pointerup', (e) => {
            if (!dragState.active || e.pointerId !== dragState.pointerId) return;

            const wasDragged = dragState.moved;
            const src = dragState.src;
            const cards = getSourceCards(src);

            dragState.active = false;
            dragState.moved = false;
            dom.dragLayer.style.display = 'none';
            dom.dragLayer.innerHTML = '';
            clearDropHighlights();
            dragState.sourceEls.forEach(el => { el.style.visibility = 'visible'; });
            dragState.sourceEls = [];

            if (cards.length === 0) return;

            // 1) 드래그 앤 드롭 완료 시
            if (wasDragged) {
                const best = findBestDropTarget(e.clientX, e.clientY, cards.length, cards[0]);
                if (best) {
                    attemptMove(src, { zone: best.zone, colIndex: best.colIndex });
                } else {
                    audio.invalid();
                }
                return;
            }

            // 2) 단순 클릭 / 더블클릭(더블탭) 처리
            const now = performance.now();
            const clickedCardId = cards[0].id;
            const isDoubleTap = (dragState.lastTapCardId === clickedCardId) && (now - dragState.lastTapTime < 360);
            dragState.lastTapTime = now;
            dragState.lastTapCardId = clickedCardId;

            if (isDoubleTap && cards.length === 1) {
                dragState.lastTapCardId = null;
                if (tryMoveSingleCardToAnyFoundation(src)) return;
            }

            // 이미 다른 카드가 선택되어 있었다면 해당 위치로 이동 먼저 시도
            if (state.selected) {
                if (state.selected.zone === src.zone &&
                    state.selected.colIndex === src.colIndex &&
                    state.selected.cardIndex === src.cardIndex) {
                    // 같은 카드 재클릭 시 선택 해제 (단, 더블클릭 판정을 방해하지 않도록)
                    state.selected = null;
                    renderAll();
                    return;
                }

                if (src.zone === 'foundation' || src.zone === 'tableau') {
                    if (attemptMove(state.selected, { zone: src.zone, colIndex: src.colIndex })) {
                        return;
                    }
                }
            }

            // 새 카드(또는 묶음) 선택
            state.selected = src;
            renderAll();
        });

        /**
         * ============================================================================
         * 10. 전설적인 Windows 승리 카드 폭포(Bouncing Cards Cascade) 애니메이션 컨트롤러
         * ============================================================================
         */
        const cascadeController = {
            running: false,
            rafId: null,
            launchQueue: [],
            activeCard: null,
            lastLaunchTime: 0,
            lastBonus: 0,
            showVictoryModalAfter: false,

            start(bonus = 0, demoMode = false) {
                this.stop();
                this.running = true;
                this.lastBonus = bonus;
                this.showVictoryModalAfter = !demoMode;

                const canvas = dom.cascadeCanvas;
                const feltRect = dom.feltArea.getBoundingClientRect();
                canvas.width = Math.max(320, Math.floor(feltRect.width));
                canvas.height = Math.max(300, Math.floor(feltRect.height));
                canvas.style.display = 'block';

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 4개 완성 칸의 화면 좌표 측정
                const origins = dom.foundationSlots.map(slot => {
                    const r = slot.getBoundingClientRect();
                    return {
                        x: r.left - feltRect.left,
                        y: r.top - feltRect.top
                    };
                });

                // K부터 A까지 52장을 교차로 발사 큐 생성
                this.launchQueue = [];
                for (let rank = 13; rank >= 1; rank--) {
                    for (let f = 0; f < 4; f++) {
                        const actualCard = state.foundations[f]?.[rank - 1];
                        const suit = actualCard ? actualCard.suit : SUITS[f].id;
                        this.launchQueue.push({
                            rank,
                            suit,
                            x: origins[f].x,
                            y: origins[f].y
                        });
                    }
                }

                this.activeCard = null;
                const loop = () => {
                    if (!this.running) return;

                    if (!this.activeCard) {
                        if (this.launchQueue.length === 0) {
                            this.finish();
                            return;
                        }
                        const next = this.launchQueue.shift();
                        const dir = Math.random() < 0.55 ? -1 : 1;
                        this.activeCard = {
                            ...next,
                            vx: dir * (2.6 + Math.random() * 4.2),
                            vy: -(1.5 + Math.random() * 3.5)
                        };
                    }

                    // 한 프레임에 2스텝씩 전진하며 잔상(계단식 겹침 효과)을 캔버스에 그대로 남김!
                    for (let step = 0; step < 2 && this.activeCard; step++) {
                        const c = this.activeCard;
                        c.x += c.vx;
                        c.y += c.vy;
                        c.vy += 0.52; // 중력 가속도

                        // 바닥 탄성 반사
                        if (c.y + metrics.cardH >= canvas.height) {
                            c.y = canvas.height - metrics.cardH;
                            c.vy = -Math.abs(c.vy) * 0.83;
                            if (Math.abs(c.vy) < 1.8) c.vy = -3.8;
                        }

                        this.drawSingleCascadeCard(ctx, c);

                        // 화면 좌우 밖으로 완전히 나가면 다음 카드 발사
                        if (c.x < -metrics.cardW - 10 || c.x > canvas.width + 10) {
                            this.activeCard = null;
                        }
                    }

                    this.rafId = requestAnimationFrame(loop);
                };

                this.rafId = requestAnimationFrame(loop);
            },

            drawSingleCascadeCard(ctx, c) {
                const w = metrics.cardW;
                const h = metrics.cardH;
                const x = Math.round(c.x);
                const y = Math.round(c.y);

                const suitObj = SUITS.find(s => s.id === c.suit) || SUITS[0];
                const color = suitObj.color === 'red' ? '#df0000' : '#000000';
                const rankStr = RANK_LABELS[c.rank];

                // 흰색 카드 배경 + 검은색 테두리 (오리지널 잔상 연출 핵심!)
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x, y, w, h, 5);
                } else {
                    ctx.rect(x, y, w, h);
                }
                ctx.fill();
                ctx.stroke();

                // 큼직한 상단 숫자 & 무늬
                ctx.fillStyle = color;
                const rankPx = Math.max(15, Math.round(w * 0.32));
                ctx.font = `900 ${rankPx}px "Arial Black", Impact, sans-serif`;
                ctx.textBaseline = 'top';
                ctx.textAlign = 'left';
                ctx.fillText(rankStr, x + 5, y + 4);

                const suitPx = Math.max(13, Math.round(w * 0.24));
                ctx.font = `${suitPx}px sans-serif`;
                ctx.textAlign = 'right';
                ctx.fillText(suitObj.symbol, x + w - 5, y + 5);

                // 중앙 큰 문양
                ctx.font = `${Math.round(w * 0.46)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(suitObj.symbol, x + w / 2, y + h * 0.58);
            },

            stop() {
                this.running = false;
                if (this.rafId) {
                    cancelAnimationFrame(this.rafId);
                    this.rafId = null;
                }
                dom.cascadeCanvas.style.display = 'none';
            },

            finish() {
                const shouldShowModal = this.showVictoryModalAfter;
                const bonus = this.lastBonus;
                this.stop();

                if (shouldShowModal) {
                    const statsEl = document.getElementById('victory-stats');
                    const scoreLine = state.scoringMode === 'vegas'
                        ? `<div>• 최종 획득 금액: <strong>${state.score < 0 ? '-' : ''}$${Math.abs(state.score)}</strong></div>`
                        : state.scoringMode === 'standard'
                            ? `<div>• 최종 점수: <strong>${state.score.toLocaleString()}점</strong> ${bonus > 0 ? `(시간 보너스 +${bonus.toLocaleString()}점 포함)` : ''}</div>`
                            : `<div>• 점수 모드: <strong>점수 없음</strong></div>`;
                    statsEl.innerHTML = `
                        ${scoreLine}
                        <div>• 소요 시간: <strong>${state.seconds}초</strong></div>
                        <div>• 게임 방식: <strong>${state.drawCount}장 넘기기</strong></div>
                    `;
                    openModal('modal-victory');
                } else {
                    setStatusMessage('승리 카드 폭포 연출이 종료되었습니다.');
                }
            }
        };

        dom.cascadeCanvas.addEventListener('click', () => {
            if (cascadeController.running) {
                cascadeController.finish();
            }
        });

        /**
         * ============================================================================
         * 11. 메뉴, 모달 대화상자(카드 뒷면, 옵션, 도움말) 및 단축키 이벤트 연결
         * ============================================================================
         */
        const triggerGameMenu = document.getElementById('trigger-game-menu');
        const dropdownGameMenu = document.getElementById('dropdown-game-menu');
        const triggerHelpMenu = document.getElementById('trigger-help-menu');
        const dropdownHelpMenu = document.getElementById('dropdown-help-menu');

        function closeAllMenus() {
            dropdownGameMenu.classList.remove('show');
            dropdownHelpMenu.classList.remove('show');
            triggerGameMenu.classList.remove('open');
            triggerHelpMenu.classList.remove('open');
        }

        triggerGameMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = dropdownGameMenu.classList.contains('show');
            closeAllMenus();
            if (!open) {
                dropdownGameMenu.classList.add('show');
                triggerGameMenu.classList.add('open');
            }
        });

        triggerHelpMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = dropdownHelpMenu.classList.contains('show');
            closeAllMenus();
            if (!open) {
                dropdownHelpMenu.classList.add('show');
                triggerHelpMenu.classList.add('open');
            }
        });

        window.addEventListener('click', () => closeAllMenus());

        function openModal(id) {
            closeAllMenus();
            const el = document.getElementById(id);
            if (el) el.classList.add('open');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('open');
        }

        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.dataset.close));
        });

        document.querySelectorAll('.win-modal-backdrop').forEach(bg => {
            bg.addEventListener('click', (e) => {
                if (e.target === bg) bg.classList.remove('open');
            });
        });

        // 카드 뒷면 선택 모달 초기화
        let pendingBackId = state.cardBackId;
        function openCardBacksModal() {
            pendingBackId = state.cardBackId;
            const grid = document.getElementById('deck-backs-grid');
            grid.innerHTML = '';

            CARD_BACK_DESIGNS.forEach(design => {
                const btn = document.createElement('div');
                btn.className = 'deck-back-option flex flex-col items-center gap-1 ' +
                    (design.id === pendingBackId ? 'active' : '');
                btn.innerHTML = `
                    <div class="w-[68px] h-[94px] rounded overflow-hidden border border-black/40">${design.svg}</div>
                    <span class="text-[11px] font-bold">${design.name}</span>
                `;
                btn.addEventListener('click', () => {
                    pendingBackId = design.id;
                    grid.querySelectorAll('.deck-back-option').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    audio.flip();
                });
                btn.addEventListener('dblclick', () => {
                    state.cardBackId = design.id;
                    closeModal('modal-backs');
                    renderAll();
                });
                grid.appendChild(btn);
            });

            openModal('modal-backs');
        }

        document.getElementById('btn-backs-ok').addEventListener('click', () => {
            state.cardBackId = pendingBackId;
            closeModal('modal-backs');
            renderAll();
            setStatusMessage('카드 뒷면 디자인을 변경했습니다.');
        });

        // 옵션 모달 열기 및 저장
        function openOptionsModal() {
            document.querySelector(`input[name="opt-draw"][value="${state.drawCount}"]`).checked = true;
            document.querySelector(`input[name="opt-scoring"][value="${state.scoringMode}"]`).checked = true;
            document.getElementById('opt-timed').checked = state.timedGame;
            document.getElementById('opt-statusbar').checked = state.showStatusBar;
            document.getElementById('opt-vegas-keep').checked = state.vegasKeepCumulative;
            openModal('modal-options');
        }

        document.getElementById('btn-options-ok').addEventListener('click', () => {
            const nextDraw = parseInt(document.querySelector('input[name="opt-draw"]:checked').value, 10);
            const nextScoring = document.querySelector('input[name="opt-scoring"]:checked').value;
            const nextTimed = document.getElementById('opt-timed').checked;
            const nextStatus = document.getElementById('opt-statusbar').checked;
            const nextVegasKeep = document.getElementById('opt-vegas-keep').checked;

            const needsRedealing =
                nextDraw !== state.drawCount ||
                nextScoring !== state.scoringMode ||
                nextTimed !== state.timedGame;

            state.drawCount = nextDraw;
            state.scoringMode = nextScoring;
            state.timedGame = nextTimed;
            state.showStatusBar = nextStatus;
            state.vegasKeepCumulative = nextVegasKeep;

            closeModal('modal-options');

            if (needsRedealing) {
                startNewGame();
            } else {
                updateStatusAndButtons();
            }
        });

        // 도움말 & 정보 모달
        function openHelpHowTo() {
            document.getElementById('help-title').textContent = '카드놀이 규칙 및 조작법';
            document.getElementById('help-content').innerHTML = `
                <p><strong>■ 게임 목표:</strong> 스페이드·하트·클로버·다이아몬드 4개 무늬를 우측 상단 완성 칸에 <strong>A → 2 → … → K</strong> 순서대로 모두 쌓으면 승리합니다.</p>
                <p><strong>■ 테이블 규칙:</strong> 하단 7개 열에는 <strong>빨간색과 검은색을 번갈아 가며 내림차순(K → Q → J → 10 …)</strong>으로 쌓을 수 있으며, 빈 열에는 <strong>K(킹)</strong>만 놓을 수 있습니다.</p>
                <p><strong>■ 편리한 조작법:</strong></p>
                <ul class="list-disc pl-5 space-y-1">
                    <li><strong>드래그 앤 드롭 / 클릭 이동:</strong> 단일 카드 및 연속된 카드 묶음을 자유롭게 이동할 수 있습니다.</li>
                    <li><strong>더블클릭(더블탭):</strong> 해당 카드를 즉시 완성 칸으로 올립니다.</li>
                    <li><strong>초록 배경 우클릭 (또는 [⬆ 카드 올리기]):</strong> 현재 올릴 수 있는 모든 카드를 한 번에 완성 칸으로 올립니다.</li>
                    <li><strong>단축키:</strong> <code>F2</code> 새 게임 · <code>Z</code> 실행 취소 · <code>H</code> 힌트</li>
                </ul>
            `;
            openModal('modal-help');
        }

        function openHelpAbout() {
            document.getElementById('help-title').textContent = '카드놀이 정보';
            document.getElementById('help-content').innerHTML = `
                <p class="font-bold">Microsoft® Windows Classic 카드놀이 (Solitaire 재현판)</p>
                <p>Windows 95 / 98 / XP 시절의 클래식 인터페이스, 6종의 추억의 카드 뒷면, 정통 표준·베가스 점수 계산, 그리고 전설적인 승리 카드 폭포(Bouncing Cards Cascade)를 웹으로 완벽히 재현했습니다.</p>
            `;
            openModal('modal-help');
        }

        // 상단 메뉴 및 툴바 버튼 바인딩
        document.querySelectorAll('[data-menu]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                closeAllMenus();
                const action = item.dataset.menu;
                if (action === 'deal') startNewGame();
                else if (action === 'undo') undoMove();
                else if (action === 'backs') openCardBacksModal();
                else if (action === 'options') openOptionsModal();
                else if (action === 'cascade-demo') cascadeController.start(0, true);
                else if (action === 'howto') openHelpHowTo();
                else if (action === 'about') openHelpAbout();
            });
        });

        document.getElementById('btn-new-game').addEventListener('click', () => startNewGame());
        document.getElementById('btn-win-close').addEventListener('click', () => startNewGame());
        document.getElementById('btn-win-max').addEventListener('click', () => {
            dom.windowEl.classList.toggle('max-w-[1060px]');
            dom.windowEl.classList.toggle('max-h-[860px]');
            computeResponsiveMetrics();
            renderAll();
        });
        dom.btnUndo.addEventListener('click', undoMove);
        document.getElementById('btn-backs').addEventListener('click', openCardBacksModal);
        document.getElementById('btn-options').addEventListener('click', openOptionsModal);
        document.getElementById('btn-hint').addEventListener('click', showHint);
        document.getElementById('btn-send-up').addEventListener('click', sendAllEligibleCardsUp);
        dom.btnAutoComplete.addEventListener('click', runAutoComplete);
        document.getElementById('btn-cascade').addEventListener('click', () => cascadeController.start(0, true));

        dom.btnSound.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            dom.btnSound.textContent = audio.enabled ? '🔊 소리' : '🔇 음소거';
            if (audio.enabled) audio.flip();
        });

        document.getElementById('btn-victory-new').addEventListener('click', () => {
            closeModal('modal-victory');
            startNewGame();
        });

        // 키보드 단축키 (F2, Z / Ctrl+Z, H, F1, ESC)
        window.addEventListener('keydown', (e) => {
            if (cascadeController.running && (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter')) {
                e.preventDefault();
                cascadeController.finish();
                return;
            }
            if (e.key === 'F2') {
                e.preventDefault();
                startNewGame();
            } else if (e.key === 'F1') {
                e.preventDefault();
                openHelpHowTo();
            } else if ((e.key === 'z' || e.key === 'Z') && !e.target.matches('input')) {
                e.preventDefault();
                undoMove();
            } else if ((e.key === 'h' || e.key === 'H') && !e.target.matches('input')) {
                e.preventDefault();
                showHint();
            } else if (e.key === 'Escape') {
                closeAllMenus();
                document.querySelectorAll('.win-modal-backdrop.open').forEach(m => m.classList.remove('open'));
                if (state.selected) {
                    state.selected = null;
                    renderAll();
                }
            }
        });

        // 창 크기 변경 및 프리뷰 영역 리사이즈 시 반응형 카드 치수 재계산
        window.addEventListener('resize', () => {
            if (cascadeController.running) {
                cascadeController.finish();
            }
            computeResponsiveMetrics();
            renderAll();
        });

        if (window.ResizeObserver) {
            const boardResizeObserver = new ResizeObserver(() => {
                const currentW = dom.feltArea.clientWidth;
                if (currentW > 0 && Math.abs(currentW - lastFeltWidth) >= 2) {
                    if (cascadeController.running) {
                        cascadeController.finish();
                    }
                    computeResponsiveMetrics();
                    renderAll();
                }
            });
            boardResizeObserver.observe(dom.feltArea);
        }

        // 앱 시작
        window.onload = () => {
            startNewGame(true);
        };
    </script>
</body>
</html>
